
name: Build and Deploy NOVESQ

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify build
        run: test -f dist/index.html


      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy to OVHcloud via SFTP
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USERNAME: ${{ secrets.OVH_USERNAME }}
          OVH_PASSWORD: ${{ secrets.OVH_PASSWORD }}
        run: |
          lftp -u "$OVH_USERNAME","$OVH_PASSWORD" "sftp://$OVH_HOST:22" \
          -e "set sftp:auto-confirm yes; mirror -R dist/ www/; put dist/.htaccess -o www/.htaccess; bye"


